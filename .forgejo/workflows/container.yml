name: Container CI/CD

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  docker:
    name: Build and Push Container
    runs-on: docker-privileged
    container:
      image: node:22-bookworm
      options: >-
        --privileged

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt update
          apt install -y docker.io

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Forgejo
        uses: docker/login-action@v3
        with:
          registry: git.private.coffee
          username: ${{ secrets.REPO_USER }}
          password: ${{ secrets.REPO_TOKEN }}

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contrib/podman/Containerfile
          push: true
          tags: |
            git.private.coffee/privatecoffee/small:latest
            git.private.coffee/privatecoffee/small:${{ env.GITHUB_REF_NAME }}
